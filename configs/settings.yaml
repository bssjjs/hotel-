# configs/settings.yaml —— 业务参数的唯一来源（AGENTS.md 第 8 条）
# 改参数改这里，不改代码；代码里不写 1000、30% 这类业务数字。
# 一律 UTF-8 保存（Windows 记事本另存为时选 UTF-8）。
version: "1.0"

source:
  table: bookings
  expected_rows: 119390      # 入库对账基线：与 CSV 行数一致，变了下游全部要重算
  business_cols: 32          # 业务字段数（不含 booking_id 与 4 个派生列）

cleaning:                    # 四步清洗，顺序不可交换（AGENTS.md 第 2 条 / docs/需求规格.md 5.1）
  adr_min: 0                 # 房价必须 > adr_min
  adr_max: 1000              # 超过视为录入异常（本项目最贵一间 5,400）
  keep_duplicate: first      # 去重时保留哪一条：first = booking_id 最小者

quality:                     # 16 项检查的判定阈值（每一条都对应 checks.py 里的一处判断）
  pass_threshold: 0.01       # 问题比例低于 1% 判“通过”（0.41% 的 country 缺失即由此通过）
  high_missing: 0.50         # 单字段缺失率超过 50% 判“不通过”（company_id 94.31%）
  dup_rate_fail: 0.10        # 完全重复率超过 10% 判“不通过”（实测 26.80%）
  adr_bad_fail: 0.01         # 房价异常率超过 1% 判“不通过”（实测 1.64%）
  lead_time_extreme_warn: 0.05   # 提前期超 365 天的占比不超过 5% 判“通过”（实测 2.64%）
  top_country_share_fail: 0.30   # 单一客源国占比超过 30% 判“不通过”（葡萄牙 40.7%）
  min_hotels: 3              # 少于 3 家酒店判“不通过”（实测 2 家）

reporting:
  analysis_start: "2015-07-01"
  analysis_end: "2017-08-31"
  complete_year: 2016        # 唯一完整的自然年：只有它可做整年同比
  top_country_n: 10          # 客源国图取前几
  lead_time_bin_max: 365     # 提前期分箱的末段边界（DQ-12）

# 业务洞察阶段（D02 起）的口径。凡是图上出现的分箱边界、取前几名、小样本门槛，
# 都从这里读（AGENTS.md 第 8 条）；notebook 里不写 365、10、30 这类数字。
analysis:
  top_country_n: 10          # 客源国图与热力矩阵取前几
  top_room_n: 6              # 房型图取前几（A—H 九种里后几种样本很少）
  min_group_n: 30            # 分组样本下限：低于它只画点不画结论，避免 3 单算出 67%
  min_cell_n: 20             # 热力矩阵单元格下限：低于它的格子打灰，不给取消率
  focus_market: 在线旅行社    # 取消分析的主战场：占 60%，取消率也最高

  # 分箱用“左闭右开”，最后一段用一个大数收口，避免 999 天以外的记录变 NaN
  lead_time_bins: [0, 7, 30, 90, 180, 365, 99999]
  lead_time_labels: ["7 天内", "8–30 天", "31–90 天", "91–180 天", "181–365 天", "365 天以上"]
  stay_bins: [1, 2, 3, 5, 8, 999]
  stay_labels: ["1 晚", "2 晚", "3–4 晚", "5–7 晚", "8 晚以上"]
  adr_bins: [0, 60, 90, 120, 150, 200, 99999]
  adr_labels: ["60 以下", "60–90", "90–120", "120–150", "150–200", "200 以上"]
  # 取消发生在“到达前多少天”，决定干预窗口；与 lead_time（预订提前期）不是一回事
  cancel_lead_bins: [0, 7, 30, 90, 99999]
  cancel_lead_labels: ["到达前 7 天内", "8–30 天", "31–90 天", "90 天以上"]

  # 同比：2015 只有下半年、2017 只有前八个月，只能取两年都完整的 1–8 月
  comparison_years: [2016, 2017]
  comparable_months: [1, 2, 3, 4, 5, 6, 7, 8]

  # 情景参数的默认值。**这是假设，不是从数据里估出来的**：
  # 假设对提前 90 天以上的订单做一次再确认，该组取消率相对下降一成。
  scenario_relative_drop: 0.10
  scenario_lead_days: 90
