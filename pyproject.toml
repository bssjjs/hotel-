[project]
name = "hotel-dq"
version = "0.1.0"
description = "酒店预订数据集的数据质量评估：字段画像、16 项稽核、四步清洗与可追溯流水线"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "一班第十二组" }]
keywords = ["数据质量", "酒店预订", "pandas", "matplotlib", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Environment :: Console",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_dq"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
