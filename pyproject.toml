[project]
name = "hotel-insight"
version = "2.0.0"
description = "酒店预订数据的业务洞察：客源、时间、房型与取消归因，区分结构性因素与可干预因素"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "一班第十二组" }]
keywords = ["酒店预订", "取消归因", "结构分解", "数据洞察", "pandas", "matplotlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Environment :: Console",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_insight"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
